hibp_password_guard.settings:
  type: config_object
  label: 'HIBP Password Guard settings'
  mapping:
    enabled:
      type: boolean
      label: 'Module enabled'
    cache_ttl:
      type: integer
      label: 'Cache TTL in seconds'
    fail_mode:
      type: string
      label: 'Degradation mode (fail_open or fail_closed)'
    http_timeout:
      type: integer
      label: 'HTTP request timeout in seconds'
    api_base_url:
      type: string
      label: 'HIBP API base URL'
